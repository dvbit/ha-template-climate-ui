# Copy to .github/workflows/tests.yml (the publishing token lacks `workflow` scope).
# SPEC §8: ruff + pytest against a real Home Assistant.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff "git+https://github.com/MatthewFlamm/pytest-homeassistant-custom-component.git"
      - name: Lint
        run: ruff check custom_components tests
      - name: Test
        run: python -m pytest -q
